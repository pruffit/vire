services:
  postgres:
    image: postgres:16-alpine
    container_name: vire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vire
      POSTGRES_PASSWORD: vire
      POSTGRES_DB: vire
    ports:
      - "5432:5432"
    volumes:
      - vire-pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vire-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: vire-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vire-minio-data:/data

  # Создаёт бакеты vire-vault и vire-stream при первом запуске
  minio-init:
    image: minio/mc:latest
    container_name: vire-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/vire-vault;
        mc mb --ignore-existing local/vire-stream;
        mc anonymous set download local/vire-stream;
        exit 0;
      "

volumes:
  vire-pg-data:
  vire-redis-data:
  vire-minio-data:
