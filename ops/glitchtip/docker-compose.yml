# GlitchTip — self-hosted, Sentry-wire-совместимый трекинг ошибок. Нужен потому,
# что sentry.io блокирует РФ (403), а наш SDK (@sentry/nextjs/@sentry/node) шлёт по
# стандартному протоколу → GlitchTip принимает без изменений кода Vire.
#
# Запуск на VPS (или отдельной мелкой машине): заполни .env (см. .env.example),
# затем `docker compose up -d`. За Caddy проксируй свой домен на web:8080.
# Тег образа закреплён — перед апгрейдом сверь актуальный на glitchtip.com.

x-environment: &default-environment
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
  SECRET_KEY: ${SECRET_KEY}
  REDIS_URL: redis://redis:6379/0
  PORT: "8080"
  # Полный внешний URL инстанса (для ссылок/CSRF). Напр. https://glitchtip.viremusic.ru
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  # SMTP у Timeweb заблокирован → consolemail пишет письма в лог контейнера
  # (хватает для self-host: первого юзера регистрируешь в UI, пароль-ресет — из лога).
  EMAIL_URL: consolemail://
  CELERY_WORKER_AUTOSCALE: "1,3"
  # Открытая регистрация — включи на время создания первого аккаунта, потом выключи.
  ENABLE_OPEN_USER_REGISTRATION: ${ENABLE_OPEN_USER_REGISTRATION:-false}

x-depends_on: &default-depends_on
  postgres:
    condition: service_healthy
  redis:
    condition: service_started

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - glitchtip-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: glitchtip/glitchtip:6.1.8
    depends_on: *default-depends_on
    ports:
      - "8080:8080"
    environment: *default-environment
    restart: unless-stopped

  worker:
    image: glitchtip/glitchtip:6.1.8
    command: ./bin/run-celery-with-beat.sh
    depends_on: *default-depends_on
    environment: *default-environment
    restart: unless-stopped

  migrate:
    image: glitchtip/glitchtip:6.1.8
    depends_on: *default-depends_on
    command: ./bin/run-migrate.sh
    environment: *default-environment
    restart: "no"

volumes:
  glitchtip-pg:
