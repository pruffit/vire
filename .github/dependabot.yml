version: 2

# PR-ы открываются против main и проходят те же gates, что и обычный код.
# Обновления сгруппированы: один PR на minor/patch, один на мажоры, один на экшены.
updates:
  # JS-зависимости монорепо (pnpm workspaces; Dependabot читает pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    ignore:
      # Типы Node держим в паре с рантаймом (node-version: 22 в CI и в образах).
      - dependency-name: "@types/node"
        versions: [">=23"]
      # Мажоры тулчейна ломают сборку целиком — поднимаем осознанно, не автоматом.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # Версии GitHub Actions в .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
