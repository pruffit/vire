version: 2

# PR-ы открываются против main и проходят те же gates, что и обычный код.
# Обновления сгруппированы: один PR на minor/patch, один на мажоры, один на экшены.
updates:
  # JS-зависимости монорепо (pnpm workspaces; Dependabot читает pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Мажоры не автоматом. Сгруппированные они дают неревьюабельный PR (первая же
    # партия склеила zod 3→4, bullmq 5→6, ioredis 5→6 и RN gesture-handler 2→3 —
    # четыре несвязанные миграции в одном диффе), а по одному PR на пакет создают
    # шум, который всё равно никто не мержит. Отслеживаются вручную:
    # `pnpm outdated -r`, список ожидающих — docs/roadmap/TODO.md.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  # Версии GitHub Actions в .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
