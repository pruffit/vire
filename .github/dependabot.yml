version: 2

# Авто-обновление зависимостей. PR-ы открываются против main (default-ветка),
# проходят те же gates CI и ревьюятся перед мержем. Minor/patch сгруппированы,
# чтобы не плодить по PR на каждый пакет.
updates:
  # JS-зависимости монорепо (pnpm workspaces; Dependabot читает pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Несрочные обновления — одним PR
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"

  # Версии GitHub Actions в .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
