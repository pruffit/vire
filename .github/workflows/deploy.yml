name: Deploy

# Полный продакшн-пайплайн: gates → сборка образов → выкатка на сервер.
# Запускается тегом vX.Y.Z или вручную (Actions → Deploy → Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: pruffit

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      - name: Test
        run: pnpm turbo run test
      - name: Security audit
        run: pnpm audit --audit-level=high
      - name: Design audit (Impeccable)
        run: pnpm --filter @vire/web audit:design
      - name: Build
        run: pnpm --filter @vire/web build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru

  build-and-push:
    needs: gates
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-web:${{ github.ref_name }}
          build-args: |
            S3_PUBLIC_ENDPOINT=https://cdn.viremusic.ru
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=viremusicbot
          no-cache: true

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-worker:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-worker:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/vire
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker compose -f docker-compose.prod.yml --env-file .env run --rm worker \
              pnpm --filter @vire/db exec tsx src/migrate.ts
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
