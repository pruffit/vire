name: Deploy

# Полный продакшн-пайплайн: gates → сборка образов → выкатка на сервер.
# Запускается тегом vX.Y.Z или вручную (Actions → Deploy → Run workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: pruffit

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      # Барьер 1: конфликт имён динамических сегментов ([id] vs [releaseId]) Next
      # пропускает на build и валит в рантайме каждый запрос (клал прод в v1.0.70).
      - name: Route slug check
        run: pnpm --filter @vire/web check:routes
      # Барьер: кириллица вне словарей packages/i18n/messages в локализованной зоне.
      - name: i18n check
        run: pnpm --filter @vire/web check:i18n
      # Барьер: границы @vire/core — platform/** не знает о music/**, core чист от db/next/react.
      - name: Layer check
        run: pnpm turbo run check:layers
      # Барьер: роут /api/v1 без схемы в @vire/api-contracts вне allowlist (docs/api-contracts.md §6).
      - name: Contracts check
        run: pnpm --filter @vire/web check:contracts
      # Барьер: роут app/api берёт актора через getCaller(), а не прямой auth() (migration-plan §4.1).
      - name: Caller check
        run: pnpm --filter @vire/web check:caller
      - name: Test
        run: pnpm turbo run test
      - name: Security audit
        run: pnpm audit --audit-level=high
      - name: Design audit (Impeccable)
        run: pnpm --filter @vire/web audit:design
      - name: Build
        run: pnpm --filter @vire/web build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru

      # Барьер 2: поднимаем РОВНО прод-артефакт — standalone server.js (как в
      # Docker, CMD ["node","apps/web/server.js"]) — и дёргаем роут без БД
      # (robots.txt). Ошибки старта/роутера/middleware (как слаг-конфликт) дают
      # 5xx на любой запрос: здесь это красит CI, а не прод. 2xx/3xx = обслуживает.
      - name: Smoke (prod standalone server boots & serves)
        timeout-minutes: 6
        run: |
          cd apps/web/.next/standalone
          HOSTNAME=0.0.0.0 PORT=3000 node apps/web/server.js > /tmp/next.log 2>&1 &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/robots.txt || echo 000)
            echo "try $i: HTTP $code"
            case "$code" in
              5*) echo "::error::Smoke: $code на /robots.txt — рантайм-ошибка старта/роутера"; cat /tmp/next.log; exit 1 ;;
              200|3*) echo "Smoke OK ($code)"; break ;;
            esac
            if [ "$i" = 30 ]; then echo "::error::Smoke: сервер не ответил 2xx/3xx за 60с"; cat /tmp/next.log; exit 1; fi
            sleep 2
          done
          # Петля редиректов на локализованных путях: rewrite `/` → `/ru` в проде
          # прогоняет proxy повторно и без защиты канонизируется обратно в `/` (v1.49.0).
          for path in / /en /artists /releases; do
            out=$(curl -s --max-time 25 -o /dev/null -L --max-redirs 5 -w "%{http_code} %{num_redirects}" "http://127.0.0.1:3000$path" || echo "000 9")
            final=${out% *}; hops=${out#* }
            echo "$path: HTTP $final после $hops редиректов"
            if [ "$hops" -gt 1 ]; then
              echo "::error::Smoke: $path зациклился в редиректах ($hops)"; cat /tmp/next.log; exit 1
            fi
            # 5xx тут не проверяем: без БД контентные страницы легально падают в 500,
            # рантайм-ошибки старта ловит проверка /robots.txt выше.
            if [ "$final" = "000" ]; then
              echo "::error::Smoke: $path без ответа"; cat /tmp/next.log; exit 1
            fi
          done
          echo "Smoke OK: локализованные пути обслуживаются без петли"
          # exit, а не выход по концу скрипта: иначе шаг ждёт закрытия stdout фоновым сервером
          exit 0
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru
          NEXT_PUBLIC_SITE_URL: https://viremusic.ru
          AUTH_SECRET: ci-smoke-secret-0000000000000000000000000000
          AUTH_URL: http://localhost:3000
          # Обязательные для старта процесса (parseEnv в instrumentation.ts): без них
          # register() бросает и сервер не поднимается вовсе. Значения фиктивные —
          # smoke проверяет старт и роутер, реальных запросов в Redis/S3 тут нет.
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: ci-smoke
          S3_SECRET_KEY: ci-smoke
          S3_BUCKET_VAULT: ci-smoke-vault
          S3_BUCKET_STREAM: ci-smoke-stream

  build-and-push:
    needs: gates
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-web:${{ github.ref_name }}
          build-args: |
            S3_PUBLIC_ENDPOINT=https://cdn.viremusic.ru
            NEXT_PUBLIC_TELEGRAM_BOT_USERNAME=viremusicbot
            NEXT_PUBLIC_METRIKA_ID=109999659
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          no-cache: true

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-worker:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/vire-worker:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /opt/vire
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # Пуллим только свои образы из GHCR: полный pull ходит на Docker Hub
            # за неизменными postgres/redis/minio/mc/caddy и ловит анонимный
            # рейт-лимит 429 (уронил деплой v1.17.2). Инфра-образы уже на VPS.
            docker compose -f docker-compose.prod.yml --env-file .env pull web worker
            # Миграции ДО up -d: аддитивные изменения схемы (новые enum-значения,
            # nullable-колонки) должны существовать к моменту старта нового кода,
            # иначе он падает на отсутствующем значении. Старый код переживает
            # аддитивную схему. Запускается на свежепулленном образе worker.
            docker compose -f docker-compose.prod.yml --env-file .env run --rm worker \
              pnpm --filter @vire/db exec tsx src/migrate.ts
            docker compose -f docker-compose.prod.yml --env-file .env up -d
            docker image prune -f
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
