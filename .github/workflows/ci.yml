name: CI

# Гейты на каждый пуш в main — это единственная рабочая ветка (соло-разработка,
# PR-цикла нет).
#
# Тот же набор гейтов есть и в deploy.yml на теге v*, так что это не вторая
# проверка, а СДВИГ той же проверки раньше: без пуш-триггера поломка живёт до
# релиза и валит его. Прецедент есть — тег v1.48.0 слетел на свежей advisory
# в pnpm audit, хотя код не трогали. Лишние минуты Actions дешевле сорванного тега.
#
# paths-ignore пропускает прогон, только если в коммите НЕТ ничего, кроме
# документации и картинок. Фильтровать тоньше (по изменённым пакетам) намеренно
# не стали: правка в packages/* задевает и web, и worker, и мобилку, а гейты
# здесь существуют ровно затем, чтобы ловить то, что не видно локально —
# пропущенный по ошибке гейт дороже сэкономленных минут. В deploy.yml фильтров
# нет вообще: релиз по тегу обязан прогнать всё.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'icons/**', '.gitignore', 'LICENSE']
  # Ветки под эксперименты и PR от dependabot — если появятся, тоже под гейтами.
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'icons/**', '.gitignore', 'LICENSE']
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # Тесты гейтов видимости в packages/db идут по живой схеме: три утечки этого класса
    # (черновики, скрытый артист, смартлинк) были ошибками в SQL, чистые предикаты их не ловят.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vire
          POSTGRES_PASSWORD: vire
          POSTGRES_DB: vire_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # dist/ у @vire/design-tokens не в git (build-артефакт) — @vire/mobile импортирует
      # dist/tokens.native.ts, @vire/ui импортирует dist/tokens.css. Нужны раньше самого
      # первого шага, который их читает (Typecheck), иначе чистый чекаут падает на "Cannot
      # find module '@vire/design-tokens/native'" (turbo-граф typecheck не тянет ^build).
      # Шаг был только в deploy.yml; локально не воспроизводится, потому что dist/ уже
      # лежит на диске. Вскрылось первым же пушем в main после появления этого workflow.
      - name: Build design tokens
        run: pnpm --filter @vire/design-tokens build

      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      # Барьер: границы @vire/core — platform/** не знает о music/**, core чист от db/next/react.
      # Остальные барьеры (routes/i18n/contracts/caller) приезжают сюда через prebuild.
      - name: Layer check
        run: pnpm turbo run check:layers
      # Барьер: транспайлер AGSL → GLSL. Оба шейдера компилируются и линкуются в настоящем
      # WebGL2 — рассинхрон имён униформ Expo однажды проглотил молча, и преломление
      # простояло выключенным в проде целую фазу. Браузер ставится явно: pnpm не пускает
      # postinstall playwright (onlyBuiltDependencies), поэтому сам он не приедет.
      - name: GLSL check
        run: |
          pnpm --filter @vire/vireglass exec playwright install --with-deps chromium-headless-shell
          pnpm turbo run check:glsl
      # Компиляция шейдера ещё не значит, что деталь осталась и окном, и предметом:
      # check:optics рендерит её над полотном и меряет. Без него правка, роняющая
      # предметность над светлым фоном, проходит гейты зелёной (PR #123).
      - name: Optics check
        run: pnpm turbo run check:optics
      - name: Doc paths
        run: pnpm check:doc-paths
      # Барьер: параллелизм turbo не складывается с параллелизмом vitest.
      - name: Test concurrency check
        run: node scripts/check-test-concurrency.mjs
      # `pnpm test`, не `turbo run test`: корневой скрипт держит --concurrency=1.
      # Vitest сам параллелит файлы внутри пакета; второй, нескоординированный
      # слой параллелизма от turbo перепрописывает ядра и роняет тесты по таймауту
      # (docs/foundation/TECHNICAL_DEBT.md → «turbo run test флейкал»).
      - name: Migrate test database
        run: pnpm --filter @vire/db db:migrate:fresh
        env:
          DATABASE_URL: postgresql://vire:vire@localhost:5432/vire_test
      - name: Test
        run: pnpm test
      - name: Security audit
        # Сервис аудита npm периодически недоступен и роняет релиз, не имея отношения к коду
        # (04.09.2026 — два прогона подряд по ERR_SOCKET_TIMEOUT). Найденные уязвимости валят
        # гейт сразу, как и раньше; недоступный реестр после трёх попыток даёт предупреждение,
        # а не падение — чужой простой не должен быть стоп-фактором релиза. Прогнать вручную.
        run: |
          for attempt in 1 2 3; do
            if out=$(pnpm audit --audit-level=high 2>&1); then
              echo "$out"
              exit 0
            fi
            echo "$out"
            if ! echo "$out" | grep -qE 'ERR_SOCKET_TIMEOUT|FetchError|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              echo '::error::pnpm audit нашёл уязвимости уровня high и выше'
              exit 1
            fi
            echo "::warning::реестр npm недоступен (попытка $attempt из 3)"
          done
          echo '::warning::pnpm audit пропущен — сервис аудита npm недоступен. Прогнать вручную перед тегом.'
          exit 0
      - name: Design audit (Impeccable)
        run: pnpm --filter @vire/web audit:design
      - name: Build
        run: pnpm --filter @vire/web build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: viremusicbot
