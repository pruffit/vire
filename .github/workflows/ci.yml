name: CI

# Гейты для ветки dev и PRs в main/dev.
# На теги и прямые пуши в main не вешаем — там всё делает deploy.yml.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      - name: Test
        run: pnpm turbo run test
      - name: Security audit
        run: pnpm audit --audit-level=high
      - name: Design audit (Impeccable)
        run: pnpm --filter @vire/web audit:design
      - name: Build
        run: pnpm --filter @vire/web build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru
