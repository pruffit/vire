name: CI

# Гейты для ветки dev и PRs в main/dev.
# На теги и прямые пуши в main не вешаем — там всё делает deploy.yml.
#
# paths-ignore пропускает прогон, только если в коммите НЕТ ничего, кроме
# документации и картинок. Фильтровать тоньше (по изменённым пакетам) намеренно
# не стали: правка в packages/* задевает и web, и worker, и мобилку, а гейты
# здесь существуют ровно затем, чтобы ловить то, что не видно локально —
# пропущенный по ошибке гейт дороже сэкономленных минут. В deploy.yml фильтров
# нет вообще: релиз по тегу обязан прогнать всё.
on:
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**/*.md', 'icons/**', '.gitignore', 'LICENSE']
  pull_request:
    branches: [main, dev]
    paths-ignore: ['docs/**', '**/*.md', 'icons/**', '.gitignore', 'LICENSE']

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm turbo run typecheck
      - name: Lint
        run: pnpm turbo run lint
      # Барьер: параллелизм turbo не складывается с параллелизмом vitest.
      - name: Test concurrency check
        run: node scripts/check-test-concurrency.mjs
      # `pnpm test`, не `turbo run test`: корневой скрипт держит --concurrency=1.
      # Vitest сам параллелит файлы внутри пакета; второй, нескоординированный
      # слой параллелизма от turbo перепрописывает ядра и роняет тесты по таймауту
      # (docs/foundation/TECHNICAL_DEBT.md → «turbo run test флейкал»).
      - name: Test
        run: pnpm test
      - name: Security audit
        run: pnpm audit --audit-level=high
      - name: Design audit (Impeccable)
        run: pnpm --filter @vire/web audit:design
      - name: Build
        run: pnpm --filter @vire/web build
        env:
          DATABASE_URL: postgresql://build:build@localhost/build
          S3_PUBLIC_ENDPOINT: https://cdn.viremusic.ru
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: viremusicbot
