# Прод-стек на одном VPS (1 vCPU / 1 ГБ + swap / 40 ГБ).
# Образы vire-web/vire-worker собираются НЕ здесь, а переносятся готовыми
# (см. docs/deployment.md). Наружу торчит только Caddy (80/443).
#
# Запуск:   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Миграции: docker compose -f docker-compose.prod.yml run --rm worker \
#             pnpm --filter @vire/db exec tsx src/migrate.ts

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env   # DOMAIN, CDN_DOMAIN, ACME_EMAIL для Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - minio

  web:
    image: vire-web:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    # портов наружу нет — проксирует Caddy

  worker:
    image: vire-worker:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Тюнинг под мелкую машину
    command: >
      postgres
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c max_connections=50
    volumes:
      - vire-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # порт 5432 наружу НЕ пробрасываем

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction (дефолт) обязателен для BullMQ; лёгкий снапшот раз в минуту
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - vire-redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - vire-minio-data:/data
    # 9000/9001 наружу НЕ пробрасываем — публичный bucket отдаёт Caddy (cdn-сабдомен)

  # Создаёт bucket'ы и делает stream публичным на чтение (обложки + HLS)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
        mc mb --ignore-existing local/${S3_BUCKET_VAULT};
        mc mb --ignore-existing local/${S3_BUCKET_STREAM};
        mc anonymous set download local/${S3_BUCKET_STREAM};
        exit 0;
      "

volumes:
  vire-pg-data:
  vire-redis-data:
  vire-minio-data:
  caddy-data:
  caddy-config:
