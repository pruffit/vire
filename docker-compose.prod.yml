# Прод-стек на одном VPS (2 ядра x 3.3 ГГц / 2 ГБ + 4 ГБ swap / 40 ГБ).
# Образы vire-web/vire-worker собираются НЕ здесь (2 ГБ не тянет next build), а
# тянутся из GHCR — их собирает и пушит CI/CD (.github/workflows/deploy.yml).
#
# mem_limit у каждого сервиса: без них OOM-killer выбирает жертву сам и может
# снять Postgres из-за пика в воркере. Сумма лимитов (~2.3 ГБ) намеренно больше
# RAM — цель не поделить память, а не дать одному сервису утащить остальные;
# одновременного пика всех шести не бывает, а подушка — swap.
# Ручной фолбэк — scripts/ship.ps1. Наружу торчит только Caddy (80/443).
#
# Запуск:   docker compose -f docker-compose.prod.yml --env-file .env up -d
# Миграции: docker compose -f docker-compose.prod.yml run --rm worker \
#             pnpm --filter @vire/db exec tsx src/migrate.ts

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 64m
    env_file: .env   # DOMAIN, CDN_DOMAIN, ACME_EMAIL для Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - minio

  web:
    image: ghcr.io/pruffit/vire-web:latest
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio
    volumes:
      # Кэш next/image переживает пересоздание контейнера при деплое — иначе
      # первые посетители после каждой выкатки ловят холодную AVIF-кодировку
      # обложек (LCP 9с в PageSpeed). Только подпапка images: остальной
      # .next/cache (fetch/route) должен пересобираться под новый билд.
      - web_image_cache:/app/apps/web/.next/cache/images
    # портов наружу нет — проксирует Caddy

  worker:
    image: ghcr.io/pruffit/vire-worker:latest
    restart: unless-stopped
    # Самый прожорливый и самый пиковый сервис (ONNX-инференс + ffmpeg).
    # Именно его лимит защищает Postgres от вытеснения.
    mem_limit: 640m
    env_file: .env
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 448m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Тюнинг под 2 ГБ RAM на разделяемой машине (шесть контейнеров).
    # effective_cache_size — не аллокация, а подсказка планировщику о размере
    # кэша ОС: заниженная заставляет его избегать index scan там, где тот выгоден.
    # Проверять EXPLAIN (ANALYZE, BUFFERS) на запросах ленты и волны.
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=768MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c max_connections=30
    volumes:
      - vire-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # порт 5432 наружу НЕ пробрасываем

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    # noeviction (дефолт) обязателен для BullMQ; лёгкий снапшот раз в минуту.
    # maxmemory НЕ задаём: при noeviction упор в него = ошибки записи в очередь.
    # Границу держит mem_limit контейнера.
    command: redis-server --save 60 1 --appendonly no
    volumes:
      - vire-redis-data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 256m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - vire-minio-data:/data
    # 9000/9001 наружу НЕ пробрасываем — публичный bucket отдаёт Caddy (cdn-сабдомен)

  # Создаёт bucket'ы и делает stream публичным на чтение (обложки + HLS)
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
        mc mb --ignore-existing local/${S3_BUCKET_VAULT};
        mc mb --ignore-existing local/${S3_BUCKET_STREAM};
        mc anonymous set download local/${S3_BUCKET_STREAM};
        exit 0;
      "

volumes:
  vire-pg-data:
  vire-redis-data:
  vire-minio-data:
  caddy-data:
  caddy-config:
  web_image_cache:
